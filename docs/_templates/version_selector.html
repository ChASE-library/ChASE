{# Version selector dropdown #}
{%- if version_selector and versions -%}
<div class="version-selector" style="margin: 10px 0; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 3px;">
  <label for="version-select" style="display: block; color: #fcfcfc; font-size: 12px; margin-bottom: 5px; font-weight: bold;">
    Version:
  </label>
  <select id="version-select" onchange="switchVersion(this.value)" style="width: 100%; padding: 5px; border: 1px solid #2980B9; border-radius: 3px; background: white; color: #333; font-size: 13px;">
    {%- for ver_name, ver_url in versions.items() -%}
    <option value="{{ ver_url }}" {%- if ver_name == current_version -%}selected{%- endif -%}>
      {{ ver_name }}
    </option>
    {%- endfor -%}
  </select>
</div>
{%- endif -%}

<script>
function switchVersion(url) {
  const baseUrl = url.replace(/\/$/, '');
  if (baseUrl.endsWith('/changelog')) {
    window.location.href = baseUrl + '/';
    return;
  }
  const pathParts = window.location.pathname.split('/').filter(function (p) { return p; });
  const selector = document.getElementById('version-select');
  const knownVersions = [];
  if (selector) {
    for (let option of selector.options) {
      knownVersions.push(option.text.trim());
    }
  }
  let versionIndex = -1;
  for (let i = 0; i < pathParts.length; i++) {
    if (knownVersions.includes(pathParts[i])) {
      versionIndex = i;
      break;
    }
  }
  if (versionIndex >= 0 && pathParts[versionIndex] === 'changelog') {
    window.location.href = baseUrl + '/';
    return;
  }
  const relativePath = versionIndex >= 0 ? pathParts.slice(versionIndex + 1).join('/') : '';
  const home = baseUrl + '/';
  if (!relativePath) {
    window.location.href = home;
    return;
  }
  const target = baseUrl + '/' + relativePath;
  fetch(target, { method: 'HEAD' }).then(function (response) {
    window.location.href = response.ok ? target : home;
  }).catch(function () {
    window.location.href = home;
  });
}

// Auto-detect current version from URL and update selector
(function() {
  const currentPath = window.location.pathname;
  const pathParts = currentPath.split('/').filter(p => p);
  
  // Get known versions from select options
  const selector = document.getElementById('version-select');
  if (!selector) return;
  
  const knownVersions = [];
  for (let option of selector.options) {
    const verName = option.text.trim();
    knownVersions.push(verName);
  }
  
  // Look for version in path (could be at index 0, 1, or 2 depending on structure)
  // For project pages: /repo-name/version/... (version at index 1)
  // For user pages: /version/... (version at index 0)
  for (let i = 0; i < pathParts.length; i++) {
    if (knownVersions.includes(pathParts[i])) {
      const currentVer = pathParts[i];
      // Find option matching current version
      for (let option of selector.options) {
        if (option.text.trim() === currentVer) {
          selector.value = option.value;
          break;
        }
      }
      break;
    }
  }
})();
</script>

<style>
.version-selector select:focus {
  outline: 2px solid #2980B9;
  outline-offset: 2px;
}
</style>
